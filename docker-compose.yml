services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiosco
      POSTGRES_PASSWORD: kiosco
      POSTGRES_DB: kiosco_don_pepe
    ports:
      - "5433:5432"
    volumes:
      - kiosco_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosco -d kiosco_don_pepe"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://kiosco:kiosco@db:5432/kiosco_don_pepe
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      KIOSCO_ORIGIN_ADDRESS: ${KIOSCO_ORIGIN_ADDRESS:-Av. Rivadavia 1000, Moron, Buenos Aires, Argentina}
    ports:
      - "8000:8000"

volumes:
  kiosco_db_data:
